onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[keys]
# Free the plugin's prefix bindings from built-in actions.
edit_scrollback = "prefix+shift+e"
open_notification_target = "prefix+shift+o"

[[keys.command]]
key = "cmd+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "cmd+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
